<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The27LINKS | Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; }
        img { border-radius: 50%; width: 36px; height: 36px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>System Users</h2>
        <p>Authenticated as: {{ admin.email }}</p>
        <table>
            <tr>
                <th>Profile</th>
                <th>Name</th>
                <th>Email Address</th>
            </tr>
            {% for u in users %}
            <tr>
                <td><img src="{{ u.picture }}" alt="User Picture"></td>
                <td>{{ u.name }}</td>
                <td>{{ u.email }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
